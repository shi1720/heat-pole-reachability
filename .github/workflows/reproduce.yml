name: Reproduce research checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiments/run_study.py
      - run: python experiments/resolution.py
      - run: python experiments/general_centers.py
      - run: python experiments/witness_certificate.py
      - run: python experiments/forward_check.py
      - run: python experiments/make_figures.py
